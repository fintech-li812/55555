# workbench.example.com -> cashflow risk workbench
#
# 【部署前必做】本文件里的 workbench.example.com 是占位域名，全文替换成你的
# 实际域名即可，共 4 处：两个 server_name、以及下面两行 ssl_certificate /
# ssl_certificate_key 的证书路径（/etc/letsencrypt/live/<你的域名>/）。
# 仓库为公开仓库，故不保留真实域名与服务器地址。
#
# Replaces the previous static site at /var/www/html. The old site and the old
# nginx file are preserved in /root/backup-网站-20261027/.
#
# The application only ever listens on 127.0.0.1:8000; TLS is terminated here.
# The frontend calls relative /api/* paths, so it must stay on the site root.

server {
    listen 80;
    listen [::]:80;
    server_name workbench.example.com;
    return 301 https://$host$request_uri;
}

server {
    # nginx 1.24 (Ubuntu 24.04) has no standalone `http2 on;` directive, so the
    # parameter form is required here even though upstream deprecates it.
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    server_name workbench.example.com;

    ssl_certificate /etc/letsencrypt/live/workbench.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/workbench.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    # The API rejects bodies over 512 KB; this is the outer guard.
    client_max_body_size 2m;

    # Never log request bodies or headers that could carry a token.
    access_log /var/log/nginx/cashflow.access.log;
    error_log /var/log/nginx/cashflow.error.log warn;

    # Engine MCP. Plain, unauthenticated: this is the pre-existing internal
    # endpoint the frontend gateway calls over loopback. It is listed as an
    # open risk in docs/MCP服务设计_千问办公作为后端_v1.md.
    location /mcp {
        proxy_pass http://127.0.0.1:8123;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # Frontend MCP gateway (mcp_frontend_server.py). Authenticated by the
    # X-MCP-Token header, which is forwarded from the caller. The upstream
    # refuses to boot without a token, so the secret cannot be skipped.
    #
    # The trailing /health rewrites the prefix, because the upstream serves its
    # unauthenticated health probe only at /health. JSON-RPC arrives by POST and
    # is path-agnostic upstream, so one location covers both.
    location /mcp-frontend {
        proxy_pass http://127.0.0.1:8090/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-MCP-Token $http_x_mcp_token;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
