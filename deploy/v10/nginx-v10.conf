# Nginx 反代片段：前端(含 SSE) 与 MCP 工具层
# 放到 /etc/nginx/conf.d/cashflow-v10.conf，替换 <你的域名> 后 nginx -t && nginx -s reload
# 【待替换项 TODO】<你的域名> / 证书路径

server {
    listen 443 ssl http2;
    server_name <你的域名>;

    ssl_certificate     /etc/letsencrypt/live/<你的域名>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<你的域名>/privkey.pem;

    # ---- 前端 + SSE（关键：必须关闭缓冲，否则事件流会被攒着不发）----
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;              # SSE 必需
        proxy_cache off;
        proxy_read_timeout 3600s;         # 长连接
        chunked_transfer_encoding on;
    }

    # ---- MCP 工具层（Streamable HTTP）----
    location /mcp {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;   # Bearer 透传
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # 健康检查不对外暴露细节时可注释掉
    location = /healthz { proxy_pass http://127.0.0.1:8090/healthz; }
}

server {
    listen 80;
    server_name <你的域名>;
    return 301 https://$host$request_uri;
}
