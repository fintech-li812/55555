/var/log/rollcast/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 cfrun cfrun
    # copytruncate because the pipeline writes JSON lines from a short-lived
    # process and we would rather not coordinate a reopen.
    copytruncate
    dateext
    dateformat -%Y%m%d
}
